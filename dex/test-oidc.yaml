apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-test-oidc
  namespace: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dex-test-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        client-secret: "{{ .clientSecret }}"
        cookie-secret: "{{ .cookieSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /platform/dex/test-client-secret
    - secretKey: cookieSecret
      remoteRef:
        key: /platform/dex/test-cookie-secret
