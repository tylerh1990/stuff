apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-ldap-bind
  namespace: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dex-ldap-bind
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: /platform/dex/ldap-bind-password
