apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-ldap-ca
  namespace: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dex-ldap-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: /platform/dex/ldap-ca-pem
