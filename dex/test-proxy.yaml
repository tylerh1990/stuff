apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-test-proxy
  namespace: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex-test-proxy
  template:
    metadata:
      labels:
        app: dex-test-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://dex.k8s.hasapes.net/dex
            - name: OAUTH2_PROXY_CLIENT_ID
              value: dex-test
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-test-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-test-oidc
                  key: cookie-secret
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://dex-test.k8s.hasapes.net/oauth2/callback
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://whoami.whoami.svc.cluster.local:80/
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SCOPE
              value: openid profile email groups
            - name: OAUTH2_PROXY_APPROVAL_PROMPT
              value: auto
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dex-test-proxy
  namespace: dex
spec:
  selector:
    app: dex-test-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex-test-proxy
  namespace: dex
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - dex-test.k8s.hasapes.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: dex-test-proxy
          port: 4180
          weight: 1
