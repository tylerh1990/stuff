apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dex
resources:
  - namespace.yaml
  - ldap-bind.yaml
  - ldap-ca.yaml
  - test-oidc.yaml
  - test2-oidc.yaml
  - database.yaml
  - dex-http-route.yaml
  - test-proxy.yaml
  - test2-proxy.yaml
configMapGenerator:
  - name: ldap-config
    literals:
      - LDAP_DOMAIN=dc01.hasapes.local
      - LDAP_BIND_DN=CN=LDAP Service Account,OU=Service Accounts,DC=hasapes,DC=local
      - BASE_DN=DC=hasapes,DC=local
generatorOptions:
  disableNameSuffixHash: true
