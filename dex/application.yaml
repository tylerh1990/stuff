apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: oci://ghcr.io/dexidp/helm-charts/dex
      path: .
      targetRevision: "0.26.0"
      helm:
        releaseName: dex
        valueFiles:
          - $values/clusters/homelab/platform/dex/config-values.yaml
        valuesObject:
          replicaCount: 2
          rbac:
            create: false
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
            interval: 30s
            scrapeTimeout: 10s
            path: /metrics
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dex
                  app.kubernetes.io/instance: dex
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dex
                  app.kubernetes.io/instance: dex
          envVars:
            - name: DEX_SESSIONS_ENABLED
              value: "true"
            - name: DEX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: dex-db-app
                  key: username
            - name: DEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dex-db-app
                  key: password
            - name: DEX_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dex-ldap-bind
                  key: password
            - name: DEX_TEST_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-test-oidc
                  key: client-secret
            - name: DEX_TEST2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-test2-oidc
                  key: client-secret
          envFrom:
            - configMapRef:
                name: ldap-config
          volumes:
            - name: postgres-ca
              secret:
                secretName: dex-db-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: ldap-ca
              secret:
                secretName: dex-ldap-ca
                items:
                  - key: ca.crt
                    path: ca.crt
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/dex-certs/postgres
              readOnly: true
            - name: ldap-ca
              mountPath: /etc/dex-certs/ldap
              readOnly: true
    - repoURL: https://gitlab.com/hasapes/cluster-gitops.git
      targetRevision: main
      path: clusters/homelab/platform/dex
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dex
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
